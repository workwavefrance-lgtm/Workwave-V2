<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Reel montage projets 30 jours · gabarit Workwave</title>
<style>
  /* ============================================================
     GABARIT REEL "MONTAGE 30 JOURS" : noir et blanc en alternance.
     Donnees injectees via reel-projets-30j-data.js :
       window.PROJETS = [ { metier, ville, dept, urgence, budget|null,
                            besoin, date "AAAA-MM-JJ" }, ... ]
       window.META    = { titre, sousTitre, total, premierFond "noir"|"blanc" }
     Rendu deterministe : window.renderFrame(t), cf. scripts/render-reel-projets-30j.mjs
     Une carte = un fond plein (noir ou blanc), la suivante prend l'autre.
     Le coral (#FF5A36) ne sert QUE pour des details : barre de progression,
     trait a gauche du besoin, le ".fr" du wordmark et le prix sur la fin.
     Jamais en fond. Aucun emoji.
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }

  /* Deux fonds. Chaque carte porte data-fond="noir" ou "blanc". */
  .card[data-fond="blanc"] {
    --bg: #FFFFFF; --text: #0A0A0A; --text2: #6B7280; --border: #D4D4D8; --accent: #FF5A36;
    --chip-bg: #0A0A0A; --chip-text: #FFFFFF;
  }
  .card[data-fond="noir"] {
    --bg: #0A0A0A; --text: #FAFAFA; --text2: #9CA3AF; --border: #3F3F46; --accent: #FF5A36;
    --chip-bg: #FAFAFA; --chip-text: #0A0A0A;
  }
  body { background: #0A0A0A; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

  /* Barre de progression fine en haut : c'est un trait, donc coral autorise. */
  #progress { position: absolute; top: 0; left: 0; right: 0; height: 8px; z-index: 60; }
  #progress b { display: block; height: 100%; background: #FF5A36; transform-origin: left; transform: scaleX(0); }

  .card { position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: stretch; justify-content: center; gap: 0;
    padding: 240px 84px; background: var(--bg); color: var(--text); }
  .card .brand { position: absolute; top: 84px; left: 0; right: 0; text-align: center;
    font-size: 58px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
  .card .brand i { color: var(--accent); font-style: normal; }
  .el { will-change: transform, opacity; }

  /* ── Carte projet ── */
  .eyebrow { font-size: 34px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--text2); margin-bottom: 34px; }
  .eyebrow b { color: var(--text); font-weight: 800; }
  h1.metier { font-size: 150px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.0;
    text-transform: uppercase; color: var(--text); overflow-wrap: normal; }
  .lieu { margin-top: 36px; font-size: 58px; font-weight: 600; color: var(--text2); line-height: 1.2; }
  .lieu strong { color: var(--text); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 44px; }
  .chip { display: inline-flex; align-items: center; font-size: 38px; font-weight: 700;
    padding: 16px 34px; border-radius: 999px; letter-spacing: 0.01em; line-height: 1; }
  .chip.plein { background: var(--chip-bg); color: var(--chip-text); }
  .chip.contour { border: 3px solid var(--text); color: var(--text); }
  .besoin { margin-top: 56px; border-left: 10px solid var(--accent); padding: 6px 0 6px 40px;
    font-size: 46px; line-height: 1.38; font-weight: 500; color: var(--text); }
  .date { margin-top: 48px; font-size: 32px; font-weight: 600; color: var(--text2); letter-spacing: 0.02em; }

  /* ── Carte d'ouverture ── */
  .open { align-items: center; text-align: center; }
  .open .sur { font-size: 50px; font-weight: 700; color: var(--text2); letter-spacing: -0.01em; line-height: 1.3; }
  .open .sur strong { color: var(--text); }
  .open .nombre { font-size: 420px; font-weight: 800; letter-spacing: -0.06em; line-height: 0.9;
    color: var(--text); font-variant-numeric: tabular-nums; margin-top: 30px; }
  .open .mot { font-size: 96px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--text); margin-top: 8px; }
  .open .sous { margin-top: 44px; font-size: 48px; font-weight: 500; color: var(--text2); line-height: 1.35; max-width: 860px; }
  .open .trait { width: 120px; height: 10px; background: var(--accent); border-radius: 999px; margin-top: 54px; }

  /* ── Carte de fin ── */
  .fin { align-items: center; text-align: center; }
  .fin .titre { font-size: 104px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; color: var(--text); }
  .fin .voir { margin-top: 40px; font-size: 54px; font-weight: 600; color: var(--text2); line-height: 1.3; }
  .fin .voir strong { color: var(--text); }
  .fin .prix { margin-top: 62px; font-size: 128px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--accent); }
  .fin .prixsub { margin-top: 10px; font-size: 50px; font-weight: 700; color: var(--text); }
  .fin .zero { margin-top: 44px; font-size: 44px; font-weight: 600; color: var(--text2); line-height: 1.5; }
  .fin .zero strong { color: var(--text); }
  .fin .cta { margin-top: 62px; display: inline-flex; align-items: center; background: var(--chip-bg); color: var(--chip-text);
    font-size: 66px; font-weight: 800; padding: 38px 70px; border-radius: 999px; letter-spacing: -0.01em; }
</style>
</head>
<body>
<div id="stage">
  <div id="progress"><b></b></div>
</div>

<script src="reel-projets-30j-data.js"></script>
<script>
  // ── Donnees ──
  const PROJETS = Array.isArray(window.PROJETS) ? window.PROJETS : [];
  const META = window.META || {};
  const stage = document.getElementById("stage");

  // BUDGET DE DUREE : ouverture 2,5 s, 2,9 s par projet, fin 4 s.
  // 8 projets = 2500 + 8 x 2900 + 4000 = 29 700 ms (~30 s).
  // Regle de lecture : une carte doit durer au moins ~1 s de plus que
  // (delai du dernier element + 550 ms d'animation). Ici dernier delai = 600 ms.
  const DUR_OUVERTURE = 2500, DUR_PROJET = 2900, DUR_FIN = 4000;

  const MOIS_ACC = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
    "août", "septembre", "octobre", "novembre", "décembre"];
  function dateFr(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    if (!m) return "";
    const j = parseInt(m[3], 10), mo = parseInt(m[2], 10) - 1;
    return (j === 1 ? "1er" : String(j)) + " " + MOIS_ACC[mo];
  }
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  // Taille du metier : on regle sur le MOT le plus long (c'est lui qui deborde),
  // les metiers longs passent sur deux lignes. Largeur utile : 912 px.
  function tailleMetier(metier) {
    const mots = String(metier || "").split(/[\s-]+/);
    const L = Math.max(...mots.map((w) => w.length), 1);
    if (L <= 8) return 150;
    if (L <= 10) return 128;
    if (L <= 12) return 108;
    if (L <= 14) return 92;
    return 80;
  }

  // ── Construction des cartes ──
  const fonds = ["noir", "blanc"];
  let f = META.premierFond === "blanc" ? 1 : 0;
  const nextFond = () => { const v = fonds[f % 2]; f += 1; return v; };
  const cartes = [];

  function carte(fond, dur, classes, html) {
    const s = document.createElement("section");
    s.className = "card " + classes;
    s.dataset.fond = fond;
    s.dataset.dur = String(dur);
    s.innerHTML = '<div class="brand">Workwave<i>.fr</i></div>' + html;
    stage.appendChild(s);
    cartes.push(s);
    return s;
  }

  // Ouverture
  const total = META.total != null ? META.total : PROJETS.length;
  carte(nextFond(), DUR_OUVERTURE, "open",
    '<p class="el sur">' + esc(META.titre || "30 derniers jours sur") + ' <strong>Workwave.fr</strong></p>' +
    '<p class="el nombre" data-d="150" data-anim="pop" id="compteur">0</p>' +
    '<p class="el mot" data-d="150">projets</p>' +
    '<p class="el sous" data-d="450">' + esc(META.sousTitre || "déposés par des particuliers qui cherchent un pro") + '</p>' +
    '<div class="el trait" data-d="650"></div>'
  );

  // Un projet = une carte
  PROJETS.forEach((p) => {
    const chips = [];
    if (p.urgence) chips.push('<span class="chip plein">' + esc(p.urgence) + '</span>');
    if (p.budget) chips.push('<span class="chip contour">' + esc(p.budget) + '</span>');
    const d = dateFr(p.date);
    carte(nextFond(), DUR_PROJET, "projet",
      '<p class="el eyebrow">Nouveau projet' + (p.pays ? ' <b>' + esc(p.pays) + '</b>' : '') + '</p>' +
      '<h1 class="el metier" data-d="0" style="font-size:' + tailleMetier(p.metier) + 'px">' + esc(p.metier) + '</h1>' +
      '<p class="el lieu" data-d="150"><strong>' + esc(p.ville) + '</strong>' + (p.dept ? ' · ' + esc(p.dept) : '') + '</p>' +
      (chips.length ? '<div class="el chips" data-d="300">' + chips.join("") + '</div>' : '') +
      '<p class="el besoin" data-d="450">' + esc(p.besoin) + '</p>' +
      (d ? '<p class="el date" data-d="600">Déposé le ' + d + '</p>' : '')
    );
  });

  // Fin
  carte(nextFond(), DUR_FIN, "fin",
    '<p class="el titre">Ces chantiers<br>attendent un pro.</p>' +
    '<p class="el voir" data-d="300">Vous voyez le projet<br><strong>avant de payer.</strong></p>' +
    '<p class="el prix" data-d="600" data-anim="pop">9,90 €</p>' +
    '<p class="el prixsub" data-d="600">le contact</p>' +
    '<p class="el zero" data-d="900"><strong>0</strong> abonnement · <strong>0</strong> commission<br><strong>2 premiers contacts offerts</strong></p>' +
    '<span class="el cta" data-d="1200" data-anim="pop">workwave.fr/pro</span>'
  );

  // Ajustement du metier APRES construction : on mesure pour de vrai. Un mot
  // qui deborde (scrollWidth) ou un titre sur 3 lignes (scrollHeight) fait
  // baisser la taille par pas de 4 px, jusqu'a tenir sur 2 lignes max.
  // Ex. "Entreprise de nettoyage" : 128 px = 3 lignes -> ~96 px = 2 lignes.
  cartes.forEach((card) => {
    const h1 = card.querySelector("h1.metier");
    if (!h1) return;
    card.style.display = "flex";
    let size = parseInt(h1.style.fontSize, 10) || 150;
    while (size > 64 && (h1.scrollWidth > h1.clientWidth + 1 || h1.scrollHeight > size * 2.15)) {
      size -= 4; h1.style.fontSize = size + "px";
    }
    card.style.display = "none";
  });

  // ── Timeline deterministe ──
  let acc = 0; const starts = cartes.map((s) => { const st = acc; acc += +s.dataset.dur; return st; });
  window.TOTAL = acc;
  const bar = document.querySelector("#progress b");
  const compteur = document.getElementById("compteur");
  function eBack(p) { const c1 = 1.35, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }

  window.renderFrame = function (t) {
    bar.style.transform = "scaleX(" + Math.max(0, Math.min(1, t / window.TOTAL)) + ")";
    cartes.forEach((sc, i) => {
      const st = starts[i], dur = +sc.dataset.dur, en = st + dur;
      const active = t >= st && t < en;
      sc.style.display = active ? "flex" : "none";
      if (!active) return;
      sc.querySelectorAll(".el").forEach((el) => {
        const d = +el.dataset.d || 0, anim = el.dataset.anim || "up";
        const lt = t - (st + d);
        let op, tf;
        if (anim === "pop") {
          const p = Math.max(0, Math.min(1, lt / 500)), e = lt < 0 ? 0 : eBack(p);
          op = Math.max(0, Math.min(1, lt / 250)); tf = "scale(" + (0.6 + 0.4 * e) + ")";
        } else {
          const p = Math.max(0, Math.min(1, lt / 550)), e = lt < 0 ? 0 : eBack(p);
          op = Math.max(0, Math.min(1, lt / 300)); tf = "translateY(" + ((1 - e) * 40) + "px)";
        }
        el.style.opacity = op; el.style.transform = tf;
      });
      // Compteur de la carte d'ouverture : 0 -> total en 900 ms (ease-out).
      if (i === 0 && compteur) {
        const lt = t - (st + 150);
        const p = Math.max(0, Math.min(1, lt / 900));
        const e = 1 - Math.pow(1 - p, 3);
        compteur.textContent = String(Math.round(total * e));
      }
    });
  };
  window.renderFrame(0);
</script>
</body>
</html>
